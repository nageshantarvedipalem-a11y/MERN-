<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <form action="#" method="get">
        <label for="Name">Full Name:</label>
        <input type="text" id="Name" name="Name" placeholder="Enter your Name" required>
        <br><br>
        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" placeholder="Enter your Email" required>
        <br><br>
         <label for="Number">Phone Number:</label>
        <input type="text" id="Number" name="Number" placeholder="Enter your Phone Number" required>
        <br><br>
        <label for="Course">Select the course:</label>
        <select name="Course" id="Course">
            <option value="Select the Course"></option>
            <option value="HTML">Html Course</option>
            <option value="Css ">Css Course</option>
            <option value="JavaScript">JavaScript Course</option>
        </select>
        <br><br>
        <input type="checkbox" id="checkbox" name="checkbox" value="checkbox" required>
        <label for="checkbox">I agree to the terms and conditions</label>
        <br><br>
        <input type="checkbox" id="checkbox2" name="checkbox2" value="checkbox2" required>
        <label for="checkbox2">I do not agree to the terms and conditions</label>
        <br><br>
        <button type="submit" id="submit" name="submit" value="submit" >Submit</button>



    </form>
</body>
</html>

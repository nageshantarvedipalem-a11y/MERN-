<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="'viewpoint" content=""width=device-width, initial-scale="1.0">
        <title>contact form</title>

    </head>
   <body>
    <form action="#" method="get">
        <label for="name"> Full name</label>
        <input type="text" id="name" name="name" placeholder="enter your name">
        <br>
        <label for="mail"> mail id</label>
        <input type="text" id="mail" name="mail" placeholder="enter your mail id">
        <br>
        <label for="Mobile"> phone number</label>
        <input type="number" id="number" name="mobile" placeholder="enter your phone number">
        <br>
        <label for="course"> choose your Course</label>
        <select id="text" id="course" name="course" placeholder="enter your course" required>
            <option value="">-- select a course --</option>
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
        </select>
        <br>
        <input type="checkbox" id="updates" name="updates" value="updates">
        <label for="updates"> Subscribe to updates</label>
        <br>
        <button type="submit">submit</button>
    </form>
   </body> 
</html>
